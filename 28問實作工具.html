<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>穿戴甲接單工作本</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* Layout: 左側一棵會長大的樹（6 階段：樹根→樹幹→樹枝→樹葉→開花→結果），右側一次一題；最後「收成」彙整成可直接複製的接單包 */
:root{
  --ground:#E4DACC; --paper:#EFE8DE; --field:#F8F4EE;
  --ink:#3A2317; --ink-2:#76614F; --brass:#9B7346; --line:#CDBEAB;
  --leaf:#7D8A60; --bloom:#F3E9DA; --fruit:#B98A45;
  --band:#3A2317; --band-ink:#EADFD1;
  --ok:#55704A; --ok-bg:#DCE3D2; --warn:#9C5A26; --warn-bg:#F1DFCB;
  --f-mark:"Josefin Sans","Avenir Next","Century Gothic",sans-serif;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#22160F;--paper:#2D1F16;--field:#271A12;--ink:#ECE2D4;--ink-2:#B9A693;--brass:#C9A271;--line:#4B3729;
  --leaf:#93A276;--bloom:#EADFCF;--fruit:#D6A65C;--band:#140C08;--band-ink:#E6D9C8;
  --ok:#A3BD8F;--ok-bg:#2E3426;--warn:#E0A06A;--warn-bg:#3E2818;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#22160F;--paper:#2D1F16;--field:#271A12;--ink:#ECE2D4;--ink-2:#B9A693;--brass:#C9A271;--line:#4B3729;
  --leaf:#93A276;--bloom:#EADFCF;--fruit:#D6A65C;--band:#140C08;--band-ink:#E6D9C8;
  --ok:#A3BD8F;--ok-bg:#2E3426;--warn:#E0A06A;--warn-bg:#3E2818;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.shell{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:24px 96px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px}
header{grid-column:1/-1;text-align:center}
.mark{font-family:var(--f-mark);font-weight:300;font-size:13px;letter-spacing:.5em;padding-left:.5em;color:var(--brass)}
header h1{font-family:var(--f-head);font-weight:500;font-size:20px;letter-spacing:.1em;margin:6px 0 0}
header p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--plate:#E9E1D3}}
:root[data-theme="dark"]{--plate:#E9E1D3}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
.plate{background:var(--plate);border-radius:4px;padding:10px 6px}
.tree{position:relative;width:100%;max-width:250px;aspect-ratio:560/660;margin:0 auto}
.tree .lay{position:absolute;inset:0;background:var(--treeimg) center/contain no-repeat}
.tree .t-base{opacity:.24;filter:grayscale(1)}
.tree .t-grow{clip-path:inset(var(--cut,100%) 0 0 0);transition:clip-path 1.4s cubic-bezier(.4,0,.2,1)}
.tree .t-fruit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.t-fruit circle{fill:#C29445;stroke:#F3E3BF;stroke-width:2;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s cubic-bezier(.3,1.7,.5,1)}
.t-fruit circle.on{transform:scale(1)}
.stages{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.stages button{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:6px;align-items:center;background:none;border:0;padding:7px 10px;cursor:pointer;text-align:left;border-radius:3px;color:var(--ink-2)}
.stages button:hover{background:var(--paper)}
.stages button[aria-current="true"]{background:var(--band);color:var(--band-ink)}
.stages .sn{font-family:var(--f-head);font-size:14px}
.stages .st{font-size:13.5px}
.stages .sp{font-size:12px;font-variant-numeric:tabular-nums}

/* 題目卡 */
main{min-width:0}
.stage-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stage-head .sn{font-family:var(--f-head);font-size:22px;font-weight:600;color:var(--brass)}
.stage-head .st{font-family:var(--f-head);font-size:18px}
.stage-head .cnt{margin-left:auto;font-size:13px;color:var(--ink-2)}
.mind{border-left:2px solid var(--brass);padding:4px 0 4px 14px;margin:0 0 16px;color:var(--ink-2);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);padding:26px 26px}
.card h2{font-family:var(--f-head);font-weight:500;font-size:clamp(21px,4.4vw,25px);margin:0 0 4px;letter-spacing:.04em;text-wrap:balance}
.key{color:var(--ink-2);font-size:14.5px;margin:0}
.fld{margin-top:22px}
.fld > .lbl{display:block;font-weight:500;margin-bottom:10px}
.fld > .lbl small{font-weight:400;color:var(--ink-2);margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.opts.chips{display:flex;flex-wrap:wrap}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .box{display:block;height:100%;border:1px solid var(--line);background:var(--field);padding:11px 14px;border-radius:3px;transition:background .15s,border-color .15s}
.opts.chips .opt .box{padding:7px 16px;border-radius:99px}
.opt:hover .box{border-color:var(--brass)}
.opt .t{display:block}
.opt .s{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.opt .rec{display:inline-block;font-size:11px;color:var(--brass);border:1px solid currentColor;border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:2px}
.opt input:checked + .box{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.opt input:checked + .box .s,.opt input:checked + .box .rec{color:color-mix(in srgb,var(--ground) 75%,transparent)}
.opt input:focus-visible + .box{outline:2px solid var(--brass);outline-offset:2px}
input[type=text]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.texts{display:grid;gap:8px}
.other{margin-top:8px}
.res{margin-top:20px;padding:12px 16px;border-radius:3px;font-size:14.5px}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.plain{background:var(--field);color:var(--ink-2);border:1px dashed var(--line)}
.res strong{font-family:var(--f-head);font-size:20px;font-weight:600}
.helper{margin-top:14px;padding:16px;border:1px solid var(--line);background:var(--field)}
.helper .fld{margin-top:14px}
.helper .fld:first-child{margin-top:0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:1px solid var(--ink);background:transparent;padding:10px 22px;cursor:pointer;border-radius:3px}
.btn.solid{background:var(--ink);color:var(--ground)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default}

/* 收成 */
.harvest{background:var(--band);color:var(--band-ink);padding:24px 26px 20px;margin-bottom:16px}
.harvest .mark{padding-left:0}
.harvest h2{font-family:var(--f-head);font-weight:500;font-size:26px;margin:4px 0}
.harvest p{margin:0;opacity:.85;font-size:14px}
.todo{margin-top:10px;font-size:13.5px;opacity:.9}
.todo button{background:none;border:0;color:var(--brass);text-decoration:underline;cursor:pointer;padding:0 3px;font-size:13.5px}
.out{border:1px solid var(--line);background:var(--paper);margin-bottom:12px}
.out-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
.out-head span{font-family:var(--f-head);font-weight:500;display:flex;align-items:center;gap:8px}
.out-head span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--fruit);flex:none}
.out pre{margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:14.5px;line-height:1.85}
.sec{font-family:var(--f-mark);letter-spacing:.3em;font-size:12px;color:var(--brass);margin:22px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 18px;font-size:14px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.confirm{font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}

/* 收成動畫（固定一種深可可色調，兩種主題都一樣） */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 50% 38%,#4A3020 0%,#2A1A10 62%,#1C110A 100%);color:#F1E7D6;text-align:center;animation:ovIn .7s ease both;overflow:hidden}
.ov[hidden]{display:none}
.ov.out{animation:ovOut .6s ease forwards}
.ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov-in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:420px}
.medal{position:relative;width:min(290px,68vw);aspect-ratio:1;border-radius:50%;background:#EDE5D7;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(201,162,113,.5),0 0 60px 6px rgba(214,166,92,.28);animation:medalIn 1s .2s cubic-bezier(.2,.8,.2,1) both,breathe 4.5s 2.4s ease-in-out infinite}
.medal .tree{width:84%;max-width:none}
.medal .t-grow{transition:none;animation:grow 1.9s .5s cubic-bezier(.45,0,.2,1) both}
.ov .kick{font-family:var(--f-mark);font-size:12px;letter-spacing:.45em;padding-left:.45em;color:#D6A65C;margin-top:26px;animation:up .8s 2.5s ease both}
.ov h2{font-family:var(--f-head);font-weight:500;font-size:clamp(23px,5.6vw,30px);letter-spacing:.08em;margin:8px 0 10px;animation:up .9s 2.7s ease both}
.ov p{margin:0;font-size:15px;line-height:1.9;color:#DCCDB6;animation:up .9s 3.05s ease both}
.ov .btn{margin-top:22px;border-color:#D6A65C;color:#2A1A10;background:#E3C48E;padding:11px 30px;animation:up .8s 3.5s ease both}
.ov .btn:hover{background:#F0D6A6}
@keyframes ovIn{from{opacity:0}}
@keyframes ovOut{to{opacity:0;visibility:hidden}}
@keyframes medalIn{from{opacity:0;transform:scale(.9)}}
@keyframes breathe{50%{box-shadow:0 0 0 1px rgba(201,162,113,.6),0 0 90px 14px rgba(214,166,92,.38)}}
@keyframes grow{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.reveal .out,.reveal .sec,.reveal .harvest{animation:rise .7s ease both}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-inline:16px}
  aside{position:static;display:flex;flex-direction:column;gap:6px}
  aside .plate{order:2}
  .tree{max-width:200px}
  .stages{order:1;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .stages button{grid-template-columns:1fr;gap:0;padding:6px 8px;text-align:center}
  .stages .sp{display:none}
  .stages .st{display:none}
}
@media (max-width:520px){.card{padding:20px 18px}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important;animation-delay:0s!important}}
@media print{body{background:#fff}header,aside,.nav,.tools,.out-head button,.noprint{display:none!important}.shell{display:block}.out{border:0;break-inside:avoid}.harvest{background:#fff;color:#000}}
</style>

<body>
<div class="shell">
  <header><div class="mark">28 QUESTIONS</div><h1>穿戴甲｜接單前必修的28問</h1><p>從樹根到果實，一步一步長出妳自己的接單系統</p></header>
  <aside>
    <div class="plate"><div class="tree" id="tree" role="img" aria-label="接單之樹的成長進度"><div class="lay t-base"></div><div class="lay t-grow"></div><svg class="t-fruit" viewBox="0 0 560 660" aria-hidden="true"><circle cx="196" cy="150" r="11"/><circle cx="262" cy="96" r="11"/><circle cx="338" cy="140" r="11"/><circle cx="384" cy="214" r="11"/><circle cx="164" cy="226" r="11"/><circle cx="290" cy="200" r="11"/><circle cx="236" cy="262" r="11"/><circle cx="408" cy="282" r="11"/><circle cx="142" cy="292" r="11"/></svg></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ===== 六個階段：每一階段開頭一句心法（課程結論，不用再問） ===== */
const ST=[
 {n:'樹根',t:'我要賣什麼',m:'開始接單，不是看作品夠不夠漂亮，而是妳有沒有準備好把一副穿戴甲交到客人手上。技術要練，但不用等到完美才開始。'},
 {n:'樹幹',t:'我的價格',m:'材料決定成本的下限，時間決定價格的基礎。低價可以，但要有目的，不能低到只剩材料成本。'},
 {n:'樹枝',t:'我的規則',m:'尺寸不是客人的工作，是妳流程的一部分。規則沒有標準答案，但一定要在下單前講清楚。'},
 {n:'樹葉',t:'先預防售後',m:'真正厲害的售後，是讓問題不發生。遇到問題先判斷，不急著道歉，也不急著拒絕。'},
 {n:'開花',t:'讓人看見妳',m:'被看見，比完美重要。品牌不用等成功才開始，它是在每次選擇裡長出來的。'},
 {n:'結果',t:'穩定交付',m:'接單不是比誰接得多，而是比誰能穩定做下去。品質靠流程，不靠心情。'},
];
const R='rec';
const P=[
/* 樹根 */
{s:0,t:'妳想先賣哪幾款？',k:'客人買的不是妳靈感爆發的那一副，而是下單後妳能再做一次的那一款。',f:[
  {k:'items',type:'texts',n:3,l:'挑 1–3 款最有把握的',ph:['例如：裸色貓眼短甲','第二款（選填）','第三款（選填）']},
  {k:'sellable',type:'many',l:'這幾款都做得到嗎？',o:[['redo','能再做一次','知道材料、步驟和關鍵'],['resize','換尺寸還像同一款','比例、圖案、飾品可以調整'],['value','說得出好在哪','不只是「很漂亮」'],['send','敢寄給客人','自己看了不會心虛']]}],
 r:A=>{const n=(A.sellable||[]).length; if(!n&&!items().length) return null; return n===4?['ok','這幾款可以上架了。']:['warn',`還差 ${4-n} 項。做不到的款式先留在練習區，不要急著上架。`]}},
{s:0,t:'哪些單，妳先不接？',k:'不是不能接，而是先不要什麼單都接。先把最有把握的做好，再慢慢開放。',f:[
  {k:'notNow',type:'many',l:'勾選妳現在先不接的',ot:'例如：婚禮急件、只做公版',o:[['vague','需求很模糊的客製','例如「想要仙氣一點、貴氣一點」',R],['hard','很難再做一次的款式','那天剛好狀態好才做出來的',R],['rush','3 天內要的急單','沒把握的時間不要答應'],['complex','超出能力的複雜款','先穩定，再慢慢開放'],['oneone','1:1 訂製','流程跑順前先不開']]}],
 r:A=>(A.notNow||[]).length?['ok','會寫進下單須知的「目前暫不接」，客人一看就知道。']:null},
{s:0,t:'客人要從哪裡跟妳下單？',k:'客人想買卻不知道怎麼買，就很容易放棄。管道不用多，清楚最重要。',f:[
  {k:'channel',type:'many',chips:1,l:'可以複選',ot:'例如：Threads 私訊、FB 粉專',o:[['IG 私訊','IG 私訊'],['LINE 官方帳號','LINE 官方帳號'],['賣貨便','賣貨便'],['蝦皮','蝦皮'],['下單表單','下單表單'],['官網','官網']]}],
 r:A=>channels()?['ok',`客人會透過「${channels()}」下單，這會寫進下單須知。`]:null},

/* 樹幹 */
{s:1,t:'一副，實際要花多少時間？',k:'不要只算做甲片的時間。回訊息、確認尺寸款式、拍照、包裝出貨，都是妳的時間。',f:[
  {k:'make',type:'one',chips:1,l:'製作一副',ot:'輸入小時數，例如 2.5',num:1,o:[['1','1 小時'],['2','2 小時'],['3','3 小時'],['4','4 小時以上']]},
  {k:'other',type:'one',chips:1,l:'製作以外的時間',sub:'回訊息、確認、拍照、包裝出貨',ot:'輸入分鐘數，例如 45',num:1,o:[['30','約 30 分鐘'],['60','約 1 小時',R],['90','約 1.5 小時'],['120','2 小時以上']]}],
 r:A=>N('make')&&N('other')!=null?['ok',`一張單完整工時約 <strong>${hrs()} 小時</strong>，定價和工期都會用這個數字算。`]:null},
{s:1,t:'妳的時薪和材料成本',k:'基礎售價 ＝ 完整工時 × 時薪 ＋ 材料成本。',f:[
  {k:'rate',type:'one',chips:1,l:'妳想要的時薪',ot:'輸入金額，例如 180',num:1,o:[['150','150 元'],['200','200 元'],['250','250 元'],['300','300 元']]},
  {k:'mat',type:'one',chips:1,l:'一副的材料成本',sub:'凝膠、甲片、飾品、封層、包材都算',ot:'輸入金額，例如 120',num:1,o:[['50','約 50 元'],['100','約 100 元'],['150','約 150 元'],['250','約 250 元'],['400','400 元以上']]}],
 r:A=>{const b=base(); if(b==null) return A.rate||A.mat?['plain','上一步的時間和這兩項都選好，就會算出基礎售價。']:null;
   return ['ok',`${hrs()} 小時 × ${N('rate')} ＋ 材料 ${N('mat')} ＝ 基礎售價 <strong>${money(b)} 元</strong>`]}},
{s:1,t:'妳現在用哪一種價格？',k:'新手可以比成熟品牌低一點，但要清楚這不是永遠的價格。',f:[
  {k:'stage2',type:'one',l:'選一個',o:[['practice','練習價','基礎售價的 7 折'],['test','測試價','基礎售價的 9 折',R],['formal','正式價','就用基礎售價']]},
  {k:'until',type:'one',chips:1,show:A=>A.stage2&&A.stage2!=='formal',l:'什麼時候調回正式價？',ot:'例如：拍好作品集後',o:[['累積 10 單後','累積 10 單後'],['3 個月後','3 個月後'],['收到 5 則好評後','收到 5 則好評後']]}],
 r:A=>{const p=price(); if(p==null) return A.stage2?['plain','完成前兩步，就會算出妳的售價。']:null; return ['ok',`妳的售價：<strong>${money(p)} 元</strong>${A.stage2!=='formal'&&V('until')?`　${V('until')}調回 ${money(base())} 元`:''}`]}},
{s:1,t:'妳要開放哪些服務？',k:'公版、客製、1:1 訂製背後花的時間差很多，價格本來就不該一樣。新手先從公版開始。',f:[
  {k:'svc',type:'one',l:'選一個',o:[['pub','先只開公版','流程最簡單，最好管理',R],['cus','公版＋客製','可以改顏色、元素、長度'],['all','三種都開','包含 1:1 訂製']]},
  {k:'cusAdd',type:'one',chips:1,show:A=>A.svc&&A.svc!=='pub',l:'客製加價',ot:'輸入百分比，例如 20',num:1,o:[['0.15','＋15%'],['0.25','＋25%'],['0.35','＋35%']]},
  {k:'oneAdd',type:'one',chips:1,show:A=>A.svc==='all',l:'1:1 訂製加價',ot:'輸入百分比，例如 60',num:1,o:[['0.3','＋30%'],['0.5','＋50%'],['0.8','＋80%']]}],
 r:A=>{if(!A.svc)return null; if(A.svc==='pub') return ['ok','從公版開始，把流程跑順，最穩。']; const p=price();
   return p==null?['plain','完成前面的價格步驟，就會算出加價後的金額。']:['ok',`客製約 ${money(p*(1+pct('cusAdd')))} 元起${A.svc==='all'?`；1:1 訂製約 ${money(p*(1+pct('oneAdd')))} 元起`:''}`]}},

/* 樹枝 */
{s:2,t:'妳要怎麼教客人量尺寸？',k:'不要只丟一張尺寸表。妳教得越簡單，客人越好配合，後面的問題就越少。',f:[
  {k:'teach',type:'many',l:'可以複選',ot:'例如：視訊幫忙看',o:[['video','尺寸教學影片'],['pic','尺寸教學圖',R],['table','尺寸對照表'],['kit','寄尺寸測量片'],['photo','量完拍照給我確認',R]]}],
 r:A=>(A.teach||[]).length?['ok','「尺寸測量說明」已經長好，客人問尺寸時直接傳。']:null},
{s:2,t:'客人自己量錯，怎麼處理？',k:'重點不是退不退，而是客人下單前就知道規則。妳做錯的，一律由妳負責。',f:[
  {k:'wrong',type:'one',l:'客人自行量錯時',ot:'寫下妳的處理方式',o:[['fee','可以付費修改','依修改的指數收費'],['once','免費調整一次','來回運費客人負擔'],['none','不提供退換','下單前就講清楚']]},
  {k:'days',type:'one',chips:1,l:'收到後幾天內可以反映？',ot:'輸入天數',num:1,o:[['3','3 天內'],['7','7 天內']]}],
 r:A=>A.wrong?['plain','另外會自動加上：製作出錯一律免費重做或補做。']:null},
{s:2,t:'客製單的規則',k:'客製不是把喜歡的元素一直加上去。需求、修改次數、付款方式，開始做之前先講清楚。',show:A=>A.svc&&A.svc!=='pub',f:[

const declines=()=>[
 ['款式做不出來','謝謝妳喜歡這款！這個款式我目前還沒辦法做到穩定的品質，不想讓妳收到不滿意的成品，所以這次先不接。\n如果妳願意，我可以推薦幾款風格接近、我比較有把握的款式給妳。'],
 ['需求太模糊','謝謝妳的詢問！為了讓成品更接近妳想要的樣子，想先請妳提供 2–3 張參考圖，告訴我喜歡的顏色和想保留的元素。\n如果方向還不確定，也可以先從我現有的款式挑，我再幫妳微調。'],
 ['時間來不及',`謝謝妳的詢問！目前排單比較滿，最快約 ${V('lead')||'＿'} 個工作天才能出貨，怕趕不上妳需要的時間，這次先不硬接。\n如果時間可以配合，再跟我說，我幫妳保留名額。`],
 ['超出能力範圍','我懂妳想要的效果，不過這部分目前超出我能穩定做到的範圍，怕成品跟妳的期待落差太大，這次先不接。\n之後如果有開放類似的款式，我會第一時間通知妳。']];

/* ===== 畫面 ===== */
const $=s=>document.querySelector(s);
function opt(f,o,i){
  const [v,t,s,rec]=o, type=f.type==='many'?'checkbox':'radio';
  const on=f.type==='many'?(A[f.k]||[]).includes(v):A[f.k]==v;
  const isRec=rec===R||s===R, sub=s&&s!==R?s:'';
  return `<label class="opt"><input type="${type}" name="${f.k}" id="o-${f.k}-${i}" data-k="${f.k}" data-type="${f.type}" value="${esc(v)}" ${on?'checked':''}><span class="box"><span class="t">${t}${isRec?'<span class="rec">新手建議</span>':''}</span>${sub?`<span class="s">${sub}</span>`:''}</span></label>`;
}
function field(f){
  if(f.show&&!f.show(A)) return '';
  const lbl=f.l?`<span class="lbl">${f.l}${f.sub?`<small>${f.sub}</small>`:''}</span>`:'';
  if(f.type==='text') return `<div class="fld">${lbl}<input type="text" id="t-${f.k}" data-k="${f.k}" data-type="text" value="${esc(A[f.k])}" placeholder="${esc(f.ph||'')}"></div>`;
  if(f.type==='texts') return `<div class="fld">${lbl}<div class="texts">${Array.from({length:f.n},(_,i)=>`<input type="text" id="t-${f.k}-${i}" data-k="${f.k}" data-type="texts" data-i="${i}" value="${esc((A[f.k]||[])[i])}" placeholder="${esc(f.ph[i])}">`).join('')}</div></div>`;
  const os=f.ot?[...f.o,['__o','其他',f.chips?'':'自己填']]:f.o;
  const onO=f.ot&&(f.type==='many'?(A[f.k]||[]).includes('__o'):A[f.k]==='__o');
  return `<div class="fld">${lbl}<div class="opts ${f.chips?'chips':''}">${os.map((o,i)=>opt(f,o,i)).join('')}</div>${onO?`<input type="text" class="other" ${f.num?'inputmode="decimal"':''} id="t-${f.k}_o" data-k="${f.k}_o" data-type="text" value="${esc(A[f.k+'_o'])}" placeholder="${esc(f.ot)}">`:''}</div>`;
}
function helperHTML(){
  if(P[cur]?.f[0].k!=='style'||A.style!=='unsure') return '';
  const pick=quizPick();
  return `<div class="helper">${QUIZ.map(([q,os],i)=>field({k:'sq'+i,type:'one',l:q,o:os})).join('')}
   ${pick?`<div class="res ok">妳比較接近「${STY[pick]}」。之後做著做著發現不一樣，回來改就好。</div>`:''}</div>`;
}
const fieldsHTML=()=>{ const f=P[cur].f; return field(f[0])+helperHTML()+f.slice(1).map(field).join(''); };
function resultHTML(){ const r=P[cur].r?P[cur].r(A):null; return r?`<div class="res ${r[0]}">${r[1]}</div>`:''; }
const EDGE=[100,67,49,37,19,0];   // 每一階段長到的高度（由下往上 %）
function renderTree(){
  let cut=100;
  for(let s=0;s<5;s++){ const ids=stageSteps(s), f=ids.length?ids.filter(answered).length/ids.length:1;
    cut=EDGE[s]-f*(EDGE[s]-EDGE[s+1]); if(f<1) break; }
  document.querySelector('#tree .t-grow').style.setProperty('--cut',cut+'%');
  const ids5=stageSteps(5), f5=ids5.filter(answered).length/ids5.length, fr=document.querySelectorAll('#tree .t-fruit circle');
  const ripe=cut===0?Math.round(f5*fr.length):0;
  fr.forEach((c,i)=>{ c.style.transitionDelay=(i*90)+'ms'; c.classList.toggle('on',i<ripe); });
  const curS=typeof cur==='number'?P[cur].s:-1;
  $('#stages').innerHTML=ST.map((x,s)=>{const ids=stageSteps(s), d=ids.filter(answered).length;
    return `<li><button data-go="${ids[0]}" aria-current="${s===curS}"><span class="sn">${x.n}</span><span class="st">${x.t}</span><span class="sp">${d}/${ids.length}</span></button></li>`}).join('')+
   `<li><button data-go="harvest" aria-current="${cur==='harvest'}"><span class="sn">收成</span><span class="st">我的接單包</span><span class="sp"></span></button></li>`;
}

/* ===== 收成動畫：樹重新長一次、果實一顆顆結出來、金色光點慢慢往上飄 ===== */
let sparkRAF=0;
function playHarvest(){
  const ov=$('#ov'), miss=P.filter((_,i)=>visible(i)&&!answered(i)).length, n=document.querySelectorAll('#main .out').length;
  $('#ovKick').textContent='HARVEST';
  $('#ovTitle').textContent=miss?'妳的樹，已經結出果實了':'妳的接單之樹，結果了';
  $('#ovText').innerHTML=miss
    ?`妳收成了 ${n} 份接單工具，每一份都是妳親手種出來的。<br>還有 ${miss} 步沒長好，沒關係，隨時回來補上。`
    :`妳收成了 ${n} 份接單工具，每一份都是妳親手種出來的。<br>妳已經準備好了，安心去接妳的第一張單吧。`;
  const big=document.querySelectorAll('#bigtree .t-fruit circle');
  big.forEach(c=>{c.classList.remove('on'); c.style.transitionDelay='0ms';});
  ov.classList.remove('out'); ov.hidden=false; void ov.offsetWidth;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  big.forEach((c,i)=>{ c.style.transitionDelay=reduce?'0ms':(2350+i*140)+'ms'; });
  requestAnimationFrame(()=>big.forEach(c=>c.classList.add('on')));
  $('#ovBtn').focus({preventScroll:true});
  if(!reduce) sparks();
}
function sparks(){
  const cv=$('#spark'), cx=cv.getContext('2d'); let W,H,t0=performance.now();
  const fit=()=>{ const d=devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight; cv.width=W*d; cv.height=H*d; cx.setTransform(d,0,0,d,0,0); };
  fit();
  const ps=Array.from({length:46},()=>({x:Math.random(),y:.55+Math.random()*.6,r:.8+Math.random()*2.2,v:.018+Math.random()*.035,w:Math.random()*6.28,d:1.6+Math.random()*1.8}));
  cancelAnimationFrame(sparkRAF);
  const step=now=>{ const t=(now-t0)/1000; cx.clearRect(0,0,W,H);
    const fade=Math.min(1,Math.max(0,(t-1.6)/1.2));
    ps.forEach(p=>{ p.y-=p.v/60; if(p.y<-.05){p.y=1.05;p.x=Math.random();}
      const x=(p.x+Math.sin(t/p.d+p.w)*.012)*W, y=p.y*H, a=fade*(.25+.55*Math.abs(Math.sin(t*.8+p.w)))*Math.min(1,(1.05-p.y)*3);
      const g=cx.createRadialGradient(x,y,0,x,y,p.r*4); g.addColorStop(0,`rgba(240,206,140,${a})`); g.addColorStop(1,'rgba(240,206,140,0)');
      cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,p.r*4,0,6.29); cx.fill(); });
    sparkRAF=requestAnimationFrame(step); };
  sparkRAF=requestAnimationFrame(step);
}
function closeHarvest(){
  const ov=$('#ov'); if(ov.hidden||ov.classList.contains('out')) return;
  ov.classList.add('out'); document.querySelector('#main').classList.add('reveal');
  document.querySelectorAll('#main .out').forEach((o,i)=>o.style.animationDelay=(i*60)+'ms');
  setTimeout(()=>{ ov.hidden=true; cancelAnimationFrame(sparkRAF); },650);
}
function nextStep(i,dir){ let j=i+dir; while(j>=0&&j<P.length&&!visible(j)) j+=dir; return j; }
function render(){
  if(typeof cur==='number'&&(cur<0||cur>=P.length||!visible(cur))) cur=0;
  renderTree(); renderTools();
  if(cur==='harvest') return renderHarvest();
  const p=P[cur], st=ST[p.s], ids=stageSteps(p.s), pos=ids.indexOf(cur)+1, first=pos===1;
  const prev=nextStep(cur,-1), next=nextStep(cur,1);
  $('#main').innerHTML=`<div class="stage-head"><span class="sn">${st.n}</span><span class="st">${st.t}</span><span class="cnt">${pos} / ${ids.length}</span></div>
   ${first?`<p class="mind">${st.m}</p>`:''}
   <section class="card"><h2>${p.t}</h2><p class="key">${p.k}</p><div id="fields">${fieldsHTML()}</div><div id="res">${resultHTML()}</div></section>
   <div class="nav"><button class="btn ghost" data-go="${prev}" ${prev<0?'disabled':''}>上一步</button>
    <button class="btn solid" data-go="${next>=P.length?'harvest':next}">${next>=P.length?'收成：看我的接單包':P[next].s!==p.s?'長到下一階段：'+ST[P[next].s].n:'下一步'}</button></div>`;
}
const box=(t,x,id)=>`<div class="out"><div class="out-head"><span>${t}</span><button class="btn sm" data-copy="${id}">複製</button></div><pre id="${id}">${esc(x)}</pre></div>`;
function renderHarvest(){
  const miss=P.map((_,i)=>i).filter(i=>visible(i)&&!answered(i)), cus=A.svc&&A.svc!=='pub';
  $('#main').innerHTML=`<div class="harvest"><div class="mark">HARVEST</div><h2>${esc(B())}的接單包</h2>
   <p>這些是妳一路種出來的果實。複製後貼到 IG 精選、LINE 記事本或下單表單；「＿」是還沒填的地方。</p>
   ${miss.length?`<div class="todo">還沒長好：${miss.map(i=>`<button data-go="${i}">${ST[P[i].s].n}・${P[i].t}</button>`).join('')}</div>`:''}</div>
  <div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="copyAll">全部複製</button>${inFrame?'':'<button class="btn sm" data-act="print">列印／存成 PDF</button>'}</div>
  <div class="sec">給客人看</div>
  ${box('下單須知',notice(),'x1')}${box('價目表',priceList(),'x2')}${box('尺寸測量說明',sizeMsg(),'x3')}
  ${cus?box('客製需求確認單',needForm(),'x4'):''}${A.svc==='all'?box('公版與 1:1 的差別',svcExplain(),'x5'):''}
  ${box('品牌介紹（IG 自介）',brandLine(),'x6')}
  <div class="sec">常用回覆</div>
  ${box('報價',quoteMsg(),'r1')}${box('親友單說明',friendMsg(),'r2')}${box('不服貼',fitMsg(),'r3')}${box('跟想像不一樣',diffMsg(),'r4')}${box('長度不合',lenMsg(),'r5')}
  ${declines().map(([t,x],i)=>box('婉拒｜'+t,x,'d'+i)).join('')}
  <div class="sec">自己用</div>${box('出貨前檢查表',qcList(),'s1')}`;
}
function renderTools(){
  $('#tools').innerHTML=`<button class="btn sm ghost" data-act="export">備份</button><button class="btn sm ghost" data-act="import">匯入備份</button><button class="btn sm ghost" data-act="reset">全部重填</button><div id="cf" class="confirm"></div>`;
}

/* ===== 互動 ===== */
function onInput(e){
  const el=e.target, k=el.dataset.k, t=el.dataset.type; if(!k) return;
  if(t==='many'){ const s=new Set(A[k]||[]); el.checked?s.add(el.value):s.delete(el.value); A[k]=[...s]; }
  else if(t==='texts'){ const a=[...(A[k]||[])]; a[+el.dataset.i]=el.value; A[k]=a; }
  else A[k]=el.value;
  save();
  if(t==='text'||t==='texts'){ $('#res').innerHTML=resultHTML(); renderTree(); return; }
  const y=scrollY, id=el.id; $('#fields').innerHTML=fieldsHTML(); $('#res').innerHTML=resultHTML(); renderTree(); scrollTo(0,y);
  const back=document.getElementById(id); if(back) back.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeHarvest(); });
document.addEventListener('change',e=>{ if(e.target.type==='radio'||e.target.type==='checkbox') onInput(e); });
document.addEventListener('input',e=>{ if(e.target.type==='text') onInput(e); });
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1600); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast('已複製'); }catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('已複製');}catch(_){toast('請手動選取文字複製');} ta.remove(); } }
document.addEventListener('click',e=>{
  if(e.target.closest('#ovBtn')){ closeHarvest(); return; }
  const g=e.target.closest('[data-go]'); if(g&&!g.disabled){ const v=g.dataset.go, toH=v==='harvest'&&cur!=='harvest'; cur=v==='harvest'?v:+v; save(); document.querySelector('#main').classList.remove('reveal'); render(); scrollTo(0,0); if(toH) playHarvest(); return; }
  const c=e.target.closest('[data-copy]'); if(c){ copy(document.getElementById(c.dataset.copy).textContent); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  switch(a.dataset.act){
    case 'copyAll': copy([...document.querySelectorAll('.out')].map(o=>`【${o.querySelector('.out-head span').textContent}】\n`+o.querySelector('pre').textContent).join('\n\n────────\n\n')); break;
    case 'print': window.print(); break;
    case 'export': { const d=JSON.stringify({A,cur}); if(!inFrame){ const u=URL.createObjectURL(new Blob([d],{type:'application/json'})); const l=document.createElement('a'); l.href=u; l.download='接單工作本備份.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); toast('已下載備份'); } else { copy(d); toast('備份已複製，貼到記事本保存'); } break; }
    case 'import': $('#importFile').click(); break;
    case 'reset': $('#cf').innerHTML='確定清空所有答案？<button class="btn sm" data-act="yes">清空</button><button class="btn sm ghost" data-act="no">取消</button>'; break;
    case 'yes': A={}; cur=0; save(); render(); scrollTo(0,0); toast('已清空'); break;
    case 'no': $('#cf').innerHTML=''; break;
  }
});
$('#importFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.A) throw 0; A=s.A; cur=0; save(); render(); toast('已匯入'); }catch(_){ toast('這不是工作本的備份檔'); } }; r.readAsText(f); e.target.value=''; });
render();
</script>
</body>
